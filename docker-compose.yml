# Local development database only. Never point agents at production.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: cashflow_dev_only
      POSTGRES_DB: cashflow_dev
    ports:
      - "5432:5432"
    volumes:
      - cashflow_pgdata:/var/lib/postgresql/data
volumes:
  cashflow_pgdata:
