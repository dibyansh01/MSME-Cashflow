name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://cashflow:cashflow_dev_only@localhost:5432/cashflow_dev?schema=public"
      NEXTAUTH_SECRET: "ci-dummy-secret-value-for-testing"
      NEXTAUTH_URL: "http://localhost:3000"
      NODE_ENV: "test"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check Formatting
        run: npm run format:check

      - name: Run Unit Tests
        run: npm test

      - name: Build Application
        run: npm run build
